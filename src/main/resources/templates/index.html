<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LogPilot</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><p class="eyebrow">LOGPILOT / LOCAL</p><h1>Log intelligence, in one place.</h1><p class="muted">Search recent events and ask for an AI-assisted incident snapshot.</p></div><button id="analyze">Analyze recent logs</button></header><section id="insight" class="panel hidden"></section><section class="toolbar"><input id="search" type="search" placeholder="Filter messages"><select id="level"><option value="">All levels</option><option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option><option>TRACE</option></select><button id="refresh">Refresh</button><span id="count" class="muted"></span></section><section class="logs"><div th:each="event : ${logs}" class="log-row"><span class="badge" th:text="${event.level}"></span><time th:text="${#temporals.format(event.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></time><strong th:text="${event.service}"></strong><span class="message" th:text="${event.message}"></span><code th:if="${event.traceId != null}" th:text="${event.traceId}"></code></div></section><p class="footnote">AI analysis is advisory. Review the underlying events before acting.</p></main><script src="/app.js?v=2"></script></body></html>
