spring.application.name=logpilot
server.port=${SERVER_PORT:8080}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/logpilot}
spring.datasource.username=${DATABASE_USERNAME:logpilot}
spring.datasource.password=${DATABASE_PASSWORD:local-only-change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

logpilot.ai.provider=${AI_PROVIDER:mock}
logpilot.ai.api-key=${AI_API_KEY:}
logpilot.ai.model=${AI_MODEL:gpt-6-luna}
